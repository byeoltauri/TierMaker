<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 티어메이커</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #f39c12;
        }
        
        /* 티어표 전체 컨테이너 */
        .tier-list {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            border: 3px solid #444;
            background-color: #111;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        /* 각 티어 행 스타일 */
        .tier-row {
            display: flex;
            min-height: 110px;
            border-bottom: 2px solid #222;
        }
        .tier-row:last-child {
            border-bottom: none;
        }

        /* 티어 라벨 */
        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
            user-select: none;
            flex-shrink: 0;
        }

        .tier-s .tier-label { background-color: #ff7f7f; }
        .tier-a .tier-label { background-color: #ffbf7f; }
        .tier-b .tier-label { background-color: #ffdf7f; }
        .tier-c .tier-label { background-color: #ffff7f; }
        .tier-d .tier-label { background-color: #bfff7f; }

        /* 드롭존 */
        .tier-dropzone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            align-items: center;
            background-color: #1e1e1e;
            min-height: 110px;
        }

        /* 하단 이미지 보관함 */
        .image-pool-container {
            width: 100%;
            max-width: 1000px;
            background-color: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
        }
        .image-pool-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #aaa;
        }
        .image-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 120px;
            background-color: #181818;
            padding: 10px;
            border-radius: 6px;
            border: 2px dashed #555;
        }

        /* [문제점 2 해결] 직사각형 비율 유지 및 짤림 방지 스타일 */
        .tier-item {
            width: 140px;            /* 가로 고정 크기 (직사각형 형태 확보) */
            height: 80px;            /* 세로 고정 크기 */
            object-fit: contain;     /* 이미지가 짤리지 않고 전체가 비율에 맞게 들어오도록 설정 */
            background-color: #000;  /* 여백이 생길 경우 검은색 배경 처리 */
            cursor: grab;
            border-radius: 4px;
            border: 2px solid #444;
            transition: transform 0.1s;
        }
        .tier-item:active {
            cursor: grabbing;
        }
        .tier-item.dragging {
            opacity: 0.4;
        }

        .drag-over {
            background-color: #333 !important;
            border-color: #f39c12 !important;
        }
    </style>
</head>
<body>

    <h1>나만의 티어메이커</h1>

    <!-- 티어 리스트 영역 -->
    <div class="tier-list" id="tierList">
        <div class="tier-row tier-s"><div class="tier-label">S</div><div class="tier-dropzone" data-zone="S"></div></div>
        <div class="tier-row tier-a"><div class="tier-label">A</div><div class="tier-dropzone" data-zone="A"></div></div>
        <div class="tier-row tier-b"><div class="tier-label">B</div><div class="tier-dropzone" data-zone="B"></div></div>
        <div class="tier-row tier-c"><div class="tier-label">C</div><div class="tier-dropzone" data-zone="C"></div></div>
        <div class="tier-row tier-d"><div class="tier-label">D</div><div class="tier-dropzone" data-zone="D"></div></div>
    </div>

    <!-- 하단 이미지 보관함 -->
    <div class="image-pool-container">
        <div class="image-pool-title">이미지 보관함 (티어 칸과 보관함 사이를 자유롭게 이동하세요)</div>
        <div class="image-pool" id="imagePool" data-zone="pool"></div>
    </div>

    <script>
        const imagePool = document.getElementById('imagePool');
        let uuidCounter = 0;

        // [문제점 3 해결] 실행하자마자 image 폴더의 file-list.json을 읽어 자동으로 이미지 로드
        async function loadImagesAutomatically() {
            try {
                const response = await fetch('image/file-list.json');
                if (!response.ok) throw new Error('file-list.json 파일을 찾을 수 없습니다.');
                const fileNames = await response.json();

                fileNamesforEach = fileNames.forEach(filename => {
                    createImageElement(`image/${filename}`, filename);
                });
            } catch (error) {
                console.warn('자동 로드 실패 (로컬 서버 환경이 아닐 수 있습니다):', error);
                // 로컬 서버 없이 파일 단일 실행(file://)할 때를 대비한 안내 문구 표시 가능
            }
        }

        function createImageElement(src, altName) {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'tier-item';
            img.draggable = true;
            img.alt = altName;
            img.dataset.uuid = 'item-' + (++uuidCounter);
            
            addDragEvents(img);
            imagePool.appendChild(img);
        }

        // [문제점 1 해결] 증식 버그 수정: 이벤트 위임 방식 활용 또는 명확한 단일 DOM 이동 처리
        const dropzones = document.querySelectorAll('.tier-dropzone, .image-pool');

        dropzones.forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                
                const draggedUuid = e.dataTransfer.getData('text/plain');
                const draggedElement = document.querySelector(`[data-uuid="${draggedUuid}"]`);
                
                if (draggedElement) {
                    // 동일한 요소를 이동시킬 때 복제(Clone)가 일어나지 않고 기존 위치에서 잘라내어 붙여넣기(Append)되도록 보장
                    zone.appendChild(draggedElement);
                }
            });
        });

        // 드래그 이벤트 설정
        function addDragEvents(item) {
            item.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', item.dataset.uuid);
                item.classList.add('dragging');
            });

            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
            });
        }

        // 페이지 실행 시 자동 로드 함수 실행
        loadImagesAutomatically();
    </script>
</body>
</html>
